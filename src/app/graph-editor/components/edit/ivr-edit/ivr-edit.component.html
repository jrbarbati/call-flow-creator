<app-edit-shell title="Edit IVR" (save)="onSave()" (cancel)="onCancel()">
  <app-form-field label="Name">
    <input type="text" [(ngModel)]="model().name" />
  </app-form-field>

  <app-form-field label="Extension Number">
    <input type="text" [(ngModel)]="model().extensionNumber" />
  </app-form-field>

  <app-form-field label="Timeout (seconds)">
    <input type="number" [(ngModel)]="model().timeout" min="1" />
  </app-form-field>

  <app-form-field label="Timeout Destination">
    <input type="text" [ngModel]="model().timeoutDestination ?? ''" (ngModelChange)="model().timeoutDestination = $event || null" />
  </app-form-field>

  <app-form-field label="Invalid Key Destination">
    <input type="text" [ngModel]="model().invalidKeyDestination ?? ''" (ngModelChange)="model().invalidKeyDestination = $event || null" />
  </app-form-field>

  <app-form-field label="Department">
    <input type="text" [ngModel]="model().departmentName ?? ''" (ngModelChange)="model().departmentName = $event || null" />
  </app-form-field>

  <section class="dest-section">
    @for (t of triggers; track t) {
      <app-destination-editor
        [trigger]="t"
        [sourceType]="'ivr'"
        [value]="destinationFor(t)"
        (valueChange)="onDestinationChange(t, $any($event))" />
    }
  </section>

  <app-form-field label="Key Options">
    <app-row-list addLabel="Add Forward" (add)="onAddForward()">
      @for (f of model().forwards; track $index) {
        <div class="row-item">
          <div class="row-fields">
            <input type="text" placeholder="Key" [(ngModel)]="f.input" />
            <app-select-field
              [value]="f.type"
              [options]="forwardTypes"
              (valueChange)="f.type = $event" />
            <input type="text" placeholder="Destination" [ngModel]="f.destination ?? ''" (ngModelChange)="f.destination = $event || null" />
          </div>
          <button type="button" class="row-remove" (click)="onRemoveForward($index)" aria-label="Remove">&times;</button>
        </div>
      }
    </app-row-list>
  </app-form-field>
</app-edit-shell>
