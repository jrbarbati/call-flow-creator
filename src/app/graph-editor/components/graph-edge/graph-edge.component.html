@let lp = labelPosition();
<!-- Invisible wide hit area for easy clicking -->
<svg:path class="edge-hit-area"
      [class.is-dimmed]="isDimmed()"
      [attr.d]="pathD()"
      fill="none"
      (click)="onEdgeClick($event)" />

<!-- Visible edge path -->
<svg:path class="edge-path"
      [class.is-selected]="isSelected()"
      [class.is-dimmed]="isDimmed()"
      [attr.d]="pathD()"
      [attr.stroke]="color()"
      [attr.marker-end]="markerEnd()"
      fill="none"
      (click)="onEdgeClick($event)" />

<!-- Edge label -->
@if (displayLabel() && lp && !isDimmed()) {
  <svg:g [attr.transform]="'translate(' + lp.x + ',' + lp.y + ')'">
    <svg:rect class="edge-label-bg"
          [attr.x]="-(displayLabel().length * 3.2) - 6"
          y="-10"
          [attr.width]="(displayLabel().length * 6.4) + 12"
          height="20"
          rx="4" />
    <svg:text class="edge-label-text"
          x="0" y="1"
          text-anchor="middle"
          dominant-baseline="middle"
          [attr.fill]="color()">
      {{ displayLabel() }}
    </svg:text>
  </svg:g>
}
